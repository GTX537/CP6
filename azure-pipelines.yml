trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: 'Default'

stages:
- stage: CI
  displayName: 'CP6 CI artifact bridge'

  jobs:
  - job: BridgeVerifiedRuntime
    displayName: 'Bridge verified GitHub runtime artifact'
    timeoutInMinutes: 40

    workspace:
      clean: all

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
      persistCredentials: true

    - powershell: |
        $ErrorActionPreference = 'Stop'
        .\scripts\test-azure-ci-runtime-artifact-contract.ps1
        .\scripts\test-cp6-dev-runtime-artifact.ps1
        .\scripts\test-cp6-github-runtime-artifact-bridge.ps1
      displayName: 'Verify runtime artifact contracts'

    - powershell: |
        $ErrorActionPreference = 'Stop'
        $authorizationHeader = & git config --get-all http.https://github.com/.extraheader |
          Where-Object { $_ -match '^(?i)AUTHORIZATION:\s+.+' } |
          Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($authorizationHeader)) {
            throw 'The authorized GitHub checkout did not retain a repository credential for artifact download.'
        }

        try {
            [Environment]::SetEnvironmentVariable(
                'CP6_GITHUB_AUTHORIZATION',
                $authorizationHeader,
                'Process')
            & .\scripts\Receive-Cp6GitHubRuntimeArtifact.ps1 `
              -Repository 'GTX537/CP6' `
              -GitSha $env:CP6_GIT_SHA `
              -OutputRoot $env:CP6_RUNTIME_ARTIFACT_ROOT `
              -MaxWaitSeconds 1800 `
              -PollIntervalSeconds 20 |
              Out-Null
        }
        finally {
            [Environment]::SetEnvironmentVariable(
                'CP6_GITHUB_AUTHORIZATION',
                $null,
                'Process')
        }
      displayName: 'Download verified GitHub runtime artifact'
      env:
        CP6_GIT_SHA: '$(Build.SourceVersion)'
        CP6_RUNTIME_ARTIFACT_ROOT: '$(Build.ArtifactStagingDirectory)\cp6-dev-runtime'

    - publish: '$(Build.ArtifactStagingDirectory)\cp6-dev-runtime'
      artifact: 'cp6-dev-runtime'
      displayName: 'Publish DEV runtime artifact'
