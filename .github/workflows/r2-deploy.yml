name: R2 protected-environment deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without v prefix
        required: true
        type: string
      environment:
        description: Protected GitHub Environment
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: r2-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, cp6-deploy]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cp6.web/package-lock.json
      - name: Install readiness validator
        working-directory: cp6.web
        run: npm ci --ignore-scripts
      - name: Download and verify immutable candidate chain
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use major.minor.patch."
          }
          $evidenceRoot = "s3://${{ vars.R2_EVIDENCE_BUCKET }}/${{ vars.R2_EVIDENCE_PREFIX }}/v${{ inputs.version }}"
          $candidateResultPath = Join-Path $env:RUNNER_TEMP "candidate-result.json"
          $manifest = Join-Path $env:RUNNER_TEMP "release-manifest.json"
          $snapshotPath = Join-Path $env:RUNNER_TEMP "release-freeze.json"
          aws --endpoint-url "${{ vars.R2_S3_ENDPOINT }}" s3 cp `
            "$evidenceRoot/candidate-result.json" $candidateResultPath --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Candidate result download failed." }
          $candidateResult = Get-Content -LiteralPath $candidateResultPath -Raw |
            ConvertFrom-Json
          if ([int]$candidateResult.SchemaVersion -ne 1 -or
              [string]$candidateResult.ReleaseVersion -ne "${{ inputs.version }}" -or
              [string]$candidateResult.Tag -ne "v${{ inputs.version }}" -or
              [string]$candidateResult.ManifestUri -ne "$evidenceRoot/release-manifest.json" -or
              [string]$candidateResult.ManifestSha256 -notmatch "^[A-Fa-f0-9]{64}$" -or
              [string]$candidateResult.FreezeSnapshotUri -notmatch "^s3://" -or
              [string]$candidateResult.FreezeSnapshotSha256 -notmatch "^[A-Fa-f0-9]{64}$") {
            throw "Candidate result is invalid or does not belong to the requested version."
          }
          aws --endpoint-url "${{ vars.R2_S3_ENDPOINT }}" s3 cp `
            $candidateResult.ManifestUri $manifest --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Manifest download failed." }
          aws --endpoint-url "${{ vars.R2_S3_ENDPOINT }}" s3 cp `
            $candidateResult.FreezeSnapshotUri $snapshotPath --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Freeze snapshot download failed." }
          $manifestHash = (Get-FileHash $manifest -Algorithm SHA256).Hash
          $snapshotHash = (Get-FileHash $snapshotPath -Algorithm SHA256).Hash
          if ($manifestHash -ne [string]$candidateResult.ManifestSha256 -or
              $snapshotHash -ne [string]$candidateResult.FreezeSnapshotSha256) {
            throw "Downloaded candidate manifest or freeze snapshot SHA-256 does not match."
          }
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne [string]$candidateResult.GitSha) {
            throw "Checked out release Tag does not match the candidate Git SHA."
          }
          $specPath = [string]$candidateResult.ExecutionSpecPath
          if (-not (Test-Path -LiteralPath $specPath -PathType Leaf)) {
            throw "Candidate execution spec is not present in the tagged source."
          }
          ./scripts/test-r2-release-readiness.ps1 `
            -SpecPath $specPath `
            -Mode VerifySnapshot `
            -ExpectedVersion "${{ inputs.version }}" `
            -ExpectedGitSha $checkedOutSha `
            -SnapshotPath $snapshotPath `
            -ExpectedSnapshotSha256 $candidateResult.FreezeSnapshotSha256
          $snapshot = Get-Content -LiteralPath $snapshotPath -Raw | ConvertFrom-Json
          if ([string]$snapshot.Deployment.Environment -ne "${{ inputs.environment }}") {
            throw "Selected protected Environment does not match the approved freeze snapshot."
          }
          "CP6_RELEASE_MANIFEST=$manifest" >> $env:GITHUB_ENV
          "CP6_EXECUTION_SPEC=$specPath" >> $env:GITHUB_ENV
          "CP6_FREEZE_SNAPSHOT=$snapshotPath" >> $env:GITHUB_ENV
          "CP6_CANDIDATE_RESULT=$candidateResultPath" >> $env:GITHUB_ENV
          "CP6_DEPLOY_TARGET=$($snapshot.Deployment.Target)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_ENVIRONMENT=$($snapshot.Deployment.Environment)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_BASE_URL=$($snapshot.Deployment.BaseUrl)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_NAMESPACE=$($snapshot.Deployment.Namespace)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_INGRESS_HOST=$($snapshot.Deployment.IngressHost)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_INGRESS_CLASS=$($snapshot.Deployment.IngressClass)" >> $env:GITHUB_ENV
          "CP6_DEPLOY_TLS_SECRET=$($snapshot.Deployment.TlsSecret)" >> $env:GITHUB_ENV
      - name: Render runtime secrets from the environment vault
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CP6_VAULT_RENDERER) -or
              -not (Test-Path -LiteralPath $env:CP6_VAULT_RENDERER -PathType Leaf)) {
            throw "The protected environment runner has no CP6_VAULT_RENDERER."
          }
          $secretFile = Join-Path $env:RUNNER_TEMP "cp6-runtime.env"
          & $env:CP6_VAULT_RENDERER `
            --environment $env:CP6_DEPLOY_ENVIRONMENT `
            --output $secretFile
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path -LiteralPath $secretFile -PathType Leaf) -or
              (Get-Item -LiteralPath $secretFile).Length -le 0) {
            throw "Vault secret rendering failed."
          }
          "CP6_RENDERED_SECRET_FILE=$secretFile" >> $env:GITHUB_ENV
      - name: Deploy database initializer then runtime
        shell: pwsh
        run: |
          $arguments = @{
            Target = $env:CP6_DEPLOY_TARGET
            ReleaseManifestPath = $env:CP6_RELEASE_MANIFEST
            SecretEnvFile = $env:CP6_RENDERED_SECRET_FILE
            Namespace = $env:CP6_DEPLOY_NAMESPACE
          }
          if ($env:CP6_DEPLOY_TARGET -eq "Kubernetes") {
            $arguments.IngressHost = $env:CP6_DEPLOY_INGRESS_HOST
            $arguments.IngressClass = $env:CP6_DEPLOY_INGRESS_CLASS
            $arguments.TlsSecret = $env:CP6_DEPLOY_TLS_SECRET
          }
          ./scripts/deploy-r2.ps1 @arguments
      - name: Verify runtime identity and remote artifacts
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "deployment-evidence.json"
          ./scripts/test-r2-deployment.ps1 `
            -BaseUrl $env:CP6_DEPLOY_BASE_URL `
            -ReleaseManifestPath $env:CP6_RELEASE_MANIFEST `
            -ExecutionSpecPath $env:CP6_EXECUTION_SPEC `
            -FreezeSnapshotPath $env:CP6_FREEZE_SNAPSHOT `
            -CandidateResultPath $env:CP6_CANDIDATE_RESULT `
            -OutputEvidencePath $evidence
          "CP6_DEPLOYMENT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - name: Archive immutable deployment evidence
        id: evidence
        shell: pwsh
        run: |
          $manifest = Get-Content $env:CP6_RELEASE_MANIFEST | ConvertFrom-Json
          $deploymentRoot = "$($manifest.EvidenceRootUri)/deployments/${{ inputs.environment }}/${{ github.run_id }}"
          ./scripts/publish-r2-evidence.ps1 `
            -Paths @($env:CP6_DEPLOYMENT_EVIDENCE) `
            -EvidenceRootUri $deploymentRoot `
            -EndpointUrl ([uri]"${{ vars.R2_S3_ENDPOINT }}") | Out-Null
          $hash = (Get-FileHash $env:CP6_DEPLOYMENT_EVIDENCE -Algorithm SHA256).Hash
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "uri=$deploymentRoot/deployment-evidence.json" >> $env:GITHUB_OUTPUT
      - name: Deployment summary
        shell: pwsh
        run: |
          @"
          ## R2 deployment
          - Version: `${{ inputs.version }}`
          - Environment: `${{ inputs.environment }}`
          - Target: `$env:CP6_DEPLOY_TARGET`
          - Evidence SHA-256: `${{ steps.evidence.outputs.hash }}`
          - Evidence URI: `${{ steps.evidence.outputs.uri }}`
          - Approved deployment actor: `${{ github.actor }}`
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Remove rendered secrets
        if: always()
        shell: pwsh
        run: |
          if ($env:CP6_RENDERED_SECRET_FILE -and
              (Test-Path -LiteralPath $env:CP6_RENDERED_SECRET_FILE)) {
            Remove-Item -LiteralPath $env:CP6_RENDERED_SECRET_FILE -Force
          }
