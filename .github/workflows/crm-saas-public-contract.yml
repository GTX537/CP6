name: crm-saas-public-contract

# Ordinary validation runs only after explicit user authorization.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: crm-saas-public-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sanitized CRM SaaS public contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Test-CrmSaasPublicContract.ps1 -VerifyGitHubEvidence
          ./tools/Test-CrmSaasPublicContract.Tests.ps1
