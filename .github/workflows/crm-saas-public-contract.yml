name: crm-saas-public-contract

on:
  pull_request:
    paths:
      - ".github/workflows/crm-saas-public-contract.yml"
      - "docs/crm/**"
      - "docs/devops/**"
      - "docs/project-memory/**"
      - "README.md"
      - "tools/Test-CrmSaasPublicContract.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/crm-saas-public-contract.yml"
      - "docs/crm/**"
      - "docs/devops/**"
      - "docs/project-memory/**"
      - "README.md"
      - "tools/Test-CrmSaasPublicContract.ps1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sanitized CRM SaaS public contract
        shell: pwsh
        run: ./tools/Test-CrmSaasPublicContract.ps1
