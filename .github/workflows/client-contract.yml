name: client-contract

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-and-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cp6.web/package-lock.json

      - name: Enforce client contract fail-closed behavior
        shell: pwsh
        run: ./scripts/test-client-contract-workflow.ps1

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore CP6.WebApi/CP6.WebApi.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Web API restore failed.' }
          dotnet restore CP6.Desktop/CP6.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Desktop restore failed.' }
          dotnet restore CP6.Client.Tests/CP6.Client.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Client test restore failed.' }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Local tool restore failed.' }

      - name: Enforce .NET 10 release gate
        shell: pwsh
        run: ./scripts/check-client-net10-gate.ps1

      - name: Build and test .NET
        shell: pwsh
        run: |
          dotnet build CP6.WebApi/CP6.WebApi.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Web API build failed.' }
          dotnet build CP6.Desktop/CP6.Desktop.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          dotnet test CP6.Tests/CP6.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed.' }
          dotnet test CP6.Client.Tests/CP6.Client.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Client tests failed.' }

      - name: Check OpenAPI generated client drift
        shell: pwsh
        run: |
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          $env:Startup__SkipDatabaseInitialization = "true"
          $env:Startup__SkipHostedServices = "true"
          $api = Start-Process dotnet `
            -WorkingDirectory "CP6.WebApi" `
            -ArgumentList @(
              "bin/Release/net8.0/CP6.WebApi.dll",
              "--urls", "http://127.0.0.1:5080"
            ) -WindowStyle Hidden -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest "http://127.0.0.1:5080/swagger/v1/swagger.json" | Out-Null
                break
              } catch {
                if ($i -eq 29) { throw }
                Start-Sleep -Milliseconds 500
              }
            }
            ./CP6.Client.Api/scripts/check-openapi-client.ps1 `
              -SwaggerUrl "http://127.0.0.1:5080/swagger/v1/swagger.json"
          } finally {
            Stop-Process -Id $api.Id -ErrorAction SilentlyContinue
          }

      - name: Build and test Web
        working-directory: cp6.web
        env:
          CP6_RELEASE_VERSION: 0.0.0-dev.${{ github.sha }}
          CP6_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run type-check
          npm test -- --maxWorkers=4
          npm run build-only

      - name: R2 source release gate
        shell: pwsh
        run: ./scripts/test-r2-source-gate.ps1 -Configuration Release

      - name: Create hashed DEV runtime artifact
        shell: pwsh
        env:
          CP6_RELEASE_VERSION: 0.0.0-dev.${{ github.sha }}
          CP6_GIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apiPublishRoot = Join-Path $env:RUNNER_TEMP 'cp6-api-publish'
          $runtimeArtifactRoot = Join-Path $env:RUNNER_TEMP 'cp6-dev-runtime'
          dotnet publish CP6.WebApi/CP6.WebApi.csproj `
            -c Release `
            -o $apiPublishRoot `
            --no-build `
            --no-restore `
            --disable-build-servers
          if ($LASTEXITCODE -ne 0) { throw 'Unable to collect the prebuilt API payload.' }

          ./scripts/New-Cp6DevRuntimeArtifact.ps1 `
            -ApiPublishPath $apiPublishRoot `
            -WebDistPath ./cp6.web/dist `
            -WebNginxConfigPath ./cp6.web/nginx.conf `
            -OutputRoot $runtimeArtifactRoot `
            -ReleaseVersion $env:CP6_RELEASE_VERSION `
            -GitSha $env:CP6_GIT_SHA |
            Out-Null
          ./scripts/Test-Cp6DevRuntimeArtifact.ps1 `
            -ArtifactRoot $runtimeArtifactRoot `
            -ExpectedReleaseVersion $env:CP6_RELEASE_VERSION `
            -ExpectedGitSha $env:CP6_GIT_SHA

      - name: Upload DEV runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp6-dev-runtime-${{ github.sha }}
          path: ${{ runner.temp }}\cp6-dev-runtime
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Audit Android dependencies
        shell: pwsh
        run: |
          $output = dotnet list CP6.Mobile/CP6.Mobile.csproj package `
            --vulnerable --include-transitive 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            throw "Android NuGet vulnerability audit failed."
          }
          if (($output | Out-String) -match "has the following vulnerable packages") {
            throw "Android NuGet vulnerability audit found vulnerable packages."
          }
      - name: Build Android client
        run: dotnet build CP6.Mobile/CP6.Mobile.csproj -f net10.0-android -c Release
