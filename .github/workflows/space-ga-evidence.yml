name: Space GA evidence integrity

# Ordinary validation runs only after explicit user authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate current GA evidence state
        shell: pwsh
        run: ./tools/Test-SpaceGaEvidence.ps1

      - name: Exercise evidence attestation failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaEvidence.Tests.ps1

      - name: Exercise Lean Core GA release rehearsal failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaReleaseRehearsalEvidence.Tests.ps1

      - name: Exercise optional post-GA two-site Pilot failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaPilotEvidence.Tests.ps1

      - name: Exercise formal golden CAD evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaGoldenCadEvidence.Tests.ps1

      - name: Exercise formal baseline governance evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaBaselineGovernanceEvidence.Tests.ps1

      - name: Exercise formal manual-modeling evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaManualModelingEvidence.Tests.ps1

      - name: Exercise formal CAD Start evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaCadStartEvidence.Tests.ps1

      - name: Exercise formal three-path evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaThreePathEvidence.Tests.ps1

      - name: Exercise formal Viewer evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaViewerEvidence.Tests.ps1

      - name: Exercise authorized golden CAD candidate failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaGoldenCadCandidates.Tests.ps1

      - name: Exercise M0 kickoff evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaKickoffEvidence.Tests.ps1

      - name: Validate single-developer personnel seed boundaries
        shell: pwsh
        run: ./tools/Test-SpaceGaDevelopmentPersonnelSeed.Tests.ps1

      - name: Validate Development V1 completion boundary
        shell: pwsh
        run: ./tools/Test-SpaceDevelopmentV1Evidence.ps1 -RequireDevelopmentComplete

      - name: Exercise Development V1 failure modes
        shell: pwsh
        run: ./tools/Test-SpaceDevelopmentV1Evidence.Tests.ps1
