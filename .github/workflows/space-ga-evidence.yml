name: Space GA evidence integrity

on:
  pull_request:
    paths:
      - '.github/workflows/space-ga-evidence.yml'
      - 'docs/project-memory/**'
      - 'docs/space/acceptance/v1.3-ga/**'
      - 'docs/space/reports/**'
      - 'tools/Test-SpaceGaEvidence.ps1'
      - 'tools/Test-SpaceGaEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaPilotEvidence.ps1'
      - 'tools/Test-SpaceGaPilotEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaGoldenCadEvidence.ps1'
      - 'tools/Test-SpaceGaGoldenCadEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaKickoffEvidence.ps1'
      - 'tools/Test-SpaceGaKickoffEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaDevelopmentPersonnelSeed.ps1'
      - 'tools/Test-SpaceGaDevelopmentPersonnelSeed.Tests.ps1'
      - 'tools/test-fixtures/space-ga-evidence/**'
      - 'tools/test-fixtures/space-ga-pilot-evidence/**'
      - 'tools/test-fixtures/space-ga-golden-cad-evidence/**'
      - 'tools/test-fixtures/space-ga-kickoff-evidence/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/space-ga-evidence.yml'
      - 'docs/project-memory/**'
      - 'docs/space/acceptance/v1.3-ga/**'
      - 'docs/space/reports/**'
      - 'tools/Test-SpaceGaEvidence.ps1'
      - 'tools/Test-SpaceGaEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaPilotEvidence.ps1'
      - 'tools/Test-SpaceGaPilotEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaGoldenCadEvidence.ps1'
      - 'tools/Test-SpaceGaGoldenCadEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaKickoffEvidence.ps1'
      - 'tools/Test-SpaceGaKickoffEvidence.Tests.ps1'
      - 'tools/Test-SpaceGaDevelopmentPersonnelSeed.ps1'
      - 'tools/Test-SpaceGaDevelopmentPersonnelSeed.Tests.ps1'
      - 'tools/test-fixtures/space-ga-evidence/**'
      - 'tools/test-fixtures/space-ga-pilot-evidence/**'
      - 'tools/test-fixtures/space-ga-golden-cad-evidence/**'
      - 'tools/test-fixtures/space-ga-kickoff-evidence/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate current GA evidence state
        shell: pwsh
        run: ./tools/Test-SpaceGaEvidence.ps1

      - name: Exercise evidence attestation failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaEvidence.Tests.ps1

      - name: Exercise two-site Pilot evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaPilotEvidence.Tests.ps1

      - name: Exercise formal golden CAD evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaGoldenCadEvidence.Tests.ps1

      - name: Exercise M0 kickoff evidence failure modes
        shell: pwsh
        run: ./tools/Test-SpaceGaKickoffEvidence.Tests.ps1

      - name: Validate single-developer personnel seed boundaries
        shell: pwsh
        run: ./tools/Test-SpaceGaDevelopmentPersonnelSeed.Tests.ps1
