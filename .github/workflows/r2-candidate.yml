name: R2 protected-tag candidate

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: r2-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cp6.web/package-lock.json
      - name: Validate protected release ref
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v(\d+\.\d+\.\d+)$') {
            throw "Candidate tags must be vX.Y.Z."
          }
          $version = $Matches[1]
          git fetch origin main --no-tags
          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $env:GITHUB_SHA) {
            throw "The protected release tag must point at the current main commit."
          }
          [xml]$desktop = Get-Content CP6.Desktop/CP6.Desktop.csproj
          [xml]$mobile = Get-Content CP6.Mobile/CP6.Mobile.csproj
          if ([string]$desktop.Project.PropertyGroup.Version -ne $version -or
              [string]$mobile.Project.PropertyGroup.ApplicationDisplayVersion -ne $version) {
            throw "Tag, Desktop version, and Android display version must match."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore release gates
        shell: pwsh
        run: |
          dotnet restore CP6.WebApi/CP6.WebApi.csproj
          dotnet restore CP6.Tests/CP6.Tests.csproj
          dotnet restore CP6.Client.Tests/CP6.Client.Tests.csproj
          dotnet tool restore
          npm ci --prefix cp6.web
      - name: Execute source, server, client, and Web gates
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "source-gate.txt"
          & ./scripts/test-r2-source-gate.ps1 `
            -Configuration Release `
            -ExpectedVersion "${{ steps.release.outputs.version }}" 2>&1 |
            Tee-Object -FilePath $report
          if ($LASTEXITCODE -ne 0) { throw "R2 source gate failed." }
          dotnet test CP6.Tests/CP6.Tests.csproj -c Release --no-restore 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Server tests failed." }
          dotnet test CP6.Client.Tests/CP6.Client.Tests.csproj `
            -c Release --no-restore 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Client tests failed." }
          $env:CP6_RELEASE_VERSION = "${{ steps.release.outputs.version }}"
          $env:CP6_GIT_SHA = $env:GITHUB_SHA
          npm --prefix cp6.web run type-check 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Web type check failed." }
          npm --prefix cp6.web test -- --maxWorkers=4 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Web unit tests failed." }
          npm --prefix cp6.web run build-only 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Web production build failed." }
          npm --prefix cp6.web exec -- playwright install chromium 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Playwright browser installation failed." }
          npm --prefix cp6.web run e2e -- `
            --project=wms-production-mocked `
            e2e/wms-production-console.spec.ts 2>&1 |
            Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) { throw "Web WMS approval E2E failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: source-gate
          path: ${{ runner.temp }}/source-gate.txt
          retention-days: 1

  sql-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CP6_Test_Strong_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CP6_Test_Strong_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      CP6_TEST_SQLSERVER: Server=localhost,1433;Database=master;User Id=sa;Password=CP6_Test_Strong_Passw0rd!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CP6.Tests/CP6.Tests.csproj
      - name: Run SQL Server production integration tests
        run: >-
          dotnet test CP6.Tests/CP6.Tests.csproj -c Release --no-restore
          --filter FullyQualifiedName~WmsProductionSqlServerTests
          --logger "trx;LogFileName=wms-sql.trx"
          --results-directory evidence/sql
      - uses: actions/upload-artifact@v4
        with:
          name: sql-evidence
          path: evidence/sql/wms-sql.trx
          retention-days: 1

  images:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, attest, and push digest-pinned images
        id: images
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          api_repo="ghcr.io/${owner}/cp6-api"
          web_repo="ghcr.io/${owner}/cp6-web"
          docker buildx build . \
            --file CP6.WebApi/Dockerfile \
            --platform linux/amd64 \
            --build-arg RELEASE_VERSION="$VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --provenance=true --sbom=true --push \
            --tag "${api_repo}:v${VERSION}" \
            --metadata-file api-metadata.json
          docker buildx build cp6.web \
            --file cp6.web/Dockerfile \
            --platform linux/amd64 \
            --build-arg RELEASE_VERSION="$VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --provenance=true --sbom=true --push \
            --tag "${web_repo}:v${VERSION}" \
            --metadata-file web-metadata.json
          api_digest="$(jq -r '."containerimage.digest"' api-metadata.json)"
          web_digest="$(jq -r '."containerimage.digest"' web-metadata.json)"
          jq -n \
            --arg apiRepository "$api_repo" --arg apiDigest "$api_digest" \
            --arg webRepository "$web_repo" --arg webDigest "$web_digest" \
            '{api:{repository:$apiRepository,digest:$apiDigest},web:{repository:$webRepository,digest:$webDigest}}' \
            > image-metadata.json
          docker pull "${api_repo}@${api_digest}"
          docker pull "${web_repo}@${web_digest}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" anchore/syft:v1.18.1 \
            "docker:${api_repo}@${api_digest}" -o cyclonedx-json=/work/api-sbom.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" anchore/syft:v1.18.1 \
            "docker:${web_repo}@${web_digest}" -o cyclonedx-json=/work/web-sbom.json
          jq -s '{components:map(.components // []) | add, metadata:{component:{name:"cp6-r2"}}}' \
            api-sbom.json web-sbom.json > sbom.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:0.58.2 image \
            --exit-code 1 --severity HIGH,CRITICAL --format json \
            --output /work/api-vulnerabilities.json "${api_repo}@${api_digest}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:0.58.2 image \
            --exit-code 1 --severity HIGH,CRITICAL --format json \
            --output /work/web-vulnerabilities.json "${web_repo}@${web_digest}"
          jq -s '{reports:.}' api-vulnerabilities.json web-vulnerabilities.json \
            > vulnerability-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-evidence
          path: |
            image-metadata.json
            sbom.json
            vulnerability-report.json
          retention-days: 1

  sign-and-archive:
    needs: [source-gate, sql-integration, images]
    runs-on: [self-hosted, Windows, X64, cp6-release]
    environment: r2-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: source-gate
          path: evidence/source
      - uses: actions/download-artifact@v4
        with:
          name: image-evidence
          path: evidence/images
      - uses: actions/download-artifact@v4
        with:
          name: sql-evidence
          path: evidence/sql
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish and sign native clients
        shell: pwsh
        env:
          CP6_ANDROID_STORE_PASSWORD: ${{ secrets.CP6_ANDROID_STORE_PASSWORD }}
          CP6_ANDROID_KEY_PASSWORD: ${{ secrets.CP6_ANDROID_KEY_PASSWORD }}
          R2_RESOLVED_SETTINGS_JSON: ${{ secrets.R2_RESOLVED_SETTINGS_JSON }}
          VERSION: ${{ needs.source-gate.outputs.version }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "r2-$env:VERSION"
          [IO.Directory]::CreateDirectory($artifactDir) | Out-Null
          ./CP6.Desktop/scripts/publish-msix.ps1 `
            -CertificateThumbprint "${{ vars.CP6_WINDOWS_CERT_THUMBPRINT }}" `
            -OutputDirectory $artifactDir `
            -PackageUri ([uri]"${{ vars.CP6_MSIX_URL }}") `
            -AppInstallerUri ([uri]"${{ vars.CP6_APPINSTALLER_URL }}") `
            -PackageVersion "$env:VERSION.0" `
            -TimestampServerUrl ([uri]"${{ vars.CP6_TIMESTAMP_URL }}") `
            -AssetsDirectory "${{ vars.CP6_WINDOWS_ASSETS_DIRECTORY }}"
          ./CP6.Mobile/scripts/publish-apk.ps1 `
            -KeyStore "${{ vars.CP6_ANDROID_KEYSTORE_PATH }}" `
            -KeyAlias "${{ vars.CP6_ANDROID_KEY_ALIAS }}"
          $apk = Get-ChildItem CP6.Mobile/bin/Release/net10.0-android/publish `
            -Filter "*-Signed.apk" | Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          Copy-Item -LiteralPath $apk.FullName -Destination $artifactDir
          $settingsPath = Join-Path $env:RUNNER_TEMP "cp6.production.resolved.json"
          [IO.File]::WriteAllText(
            $settingsPath,
            $env:R2_RESOLVED_SETTINGS_JSON,
            [Text.UTF8Encoding]::new($false))
          "CP6_R2_ARTIFACT_DIR=$artifactDir" >> $env:GITHUB_ENV
          "CP6_R2_SETTINGS_PATH=$settingsPath" >> $env:GITHUB_ENV
      - name: Build initialization artifact and release manifest v2
        shell: pwsh
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
        run: |
          dotnet restore CP6.WebApi/CP6.WebApi.csproj
          $initDir = Join-Path $env:RUNNER_TEMP "db-init"
          dotnet publish CP6.WebApi/CP6.WebApi.csproj -c Release -o $initDir `
            --no-restore -p:Version=$env:VERSION `
            -p:InformationalVersion="$env:VERSION+$env:GITHUB_SHA"
          $initZip = Join-Path $env:RUNNER_TEMP "cp6-db-init.zip"
          Compress-Archive -Path (Join-Path $initDir "*") -DestinationPath $initZip
          $images = Get-Content evidence/images/image-metadata.json | ConvertFrom-Json
          $latestMigration = Get-ChildItem CP6.Core/Migrations -File -Filter "*.cs" |
            Where-Object { $_.Name -match '^\d{14}_.+\.cs$' -and $_.Name -notmatch '\.Designer\.cs$' } |
            Sort-Object Name | Select-Object -Last 1 -ExpandProperty BaseName
          $evidenceRoot = "s3://${{ vars.R2_EVIDENCE_BUCKET }}/${{ vars.R2_EVIDENCE_PREFIX }}/v$env:VERSION"
          ./scripts/test-r2-artifacts.ps1 `
            -ArtifactDirectory $env:CP6_R2_ARTIFACT_DIR `
            -ExpectedVersion $env:VERSION `
            -ExpectedWindowsPublisher "${{ vars.CP6_WINDOWS_PUBLISHER }}" `
            -ExpectedAndroidSignerSha256 "${{ vars.CP6_ANDROID_SIGNER_SHA256 }}" `
            -ResolvedSettingsPath $env:CP6_R2_SETTINGS_PATH `
            -GitSha $env:GITHUB_SHA `
            -ApiImageRepository $images.api.repository `
            -ApiImageDigest $images.api.digest `
            -WebImageRepository $images.web.repository `
            -WebImageDigest $images.web.digest `
            -SbomPath evidence/images/sbom.json `
            -VulnerabilityReportPath evidence/images/vulnerability-report.json `
            -DatabaseInitializationArtifactPath $initZip `
            -SourceGateReportPath evidence/source/source-gate.txt `
            -SqlIntegrationReportPath evidence/sql/wms-sql.trx `
            -LatestMigration $latestMigration `
            -EvidenceRootUri $evidenceRoot
          "CP6_R2_EVIDENCE_ROOT=$evidenceRoot" >> $env:GITHUB_ENV
          "CP6_R2_INIT_ZIP=$initZip" >> $env:GITHUB_ENV
      - name: Archive immutable release evidence
        id: archive
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:CP6_R2_ARTIFACT_DIR "release-manifest.json"),
            $env:CP6_R2_INIT_ZIP,
            "evidence/images/sbom.json",
            "evidence/images/vulnerability-report.json",
            "evidence/source/source-gate.txt",
            "evidence/sql/wms-sql.trx"
          )
          $paths += Get-ChildItem -LiteralPath $env:CP6_R2_ARTIFACT_DIR -File |
            Where-Object Name -ne "release-manifest.json" |
            Select-Object -ExpandProperty FullName
          ./scripts/publish-r2-evidence.ps1 `
            -Paths $paths `
            -EvidenceRootUri $env:CP6_R2_EVIDENCE_ROOT `
            -EndpointUrl ([uri]"${{ vars.R2_S3_ENDPOINT }}") | Out-Null
          $manifestPath = Join-Path $env:CP6_R2_ARTIFACT_DIR "release-manifest.json"
          $hash = (Get-FileHash $manifestPath -Algorithm SHA256).Hash
          "manifest_hash=$hash" >> $env:GITHUB_OUTPUT
      - name: Candidate summary
        shell: pwsh
        run: |
          @"
          ## R2 candidate
          - Version: `${{ needs.source-gate.outputs.version }}`
          - Git SHA: `$env:GITHUB_SHA`
          - Manifest SHA-256: `${{ steps.archive.outputs.manifest_hash }}`
          - Evidence URI: `$env:CP6_R2_EVIDENCE_ROOT`
          - Protected environment: `r2-candidate`
          - Approved deployment actor: `${{ github.actor }}`
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Remove rendered secrets
        if: always()
        shell: pwsh
        run: |
          if ($env:CP6_R2_SETTINGS_PATH -and
              (Test-Path -LiteralPath $env:CP6_R2_SETTINGS_PATH)) {
            Remove-Item -LiteralPath $env:CP6_R2_SETTINGS_PATH -Force
          }
