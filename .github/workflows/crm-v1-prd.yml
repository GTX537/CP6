name: crm-v1-prd

on:
  # This workflow exists only on protected main after the bootstrap merge.
  # It is the sole producer of the required crm-v1-prd context.
  pull_request_target:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crm-v1-prd.yml"
      - "docs/crm/**"
      - "docs/project-memory/**"
      - "README.md"
      - "tools/Test-CrmV1Prd.ps1"
      - "tools/Test-CrmV1Prd.Tests.ps1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: crm-v1-prd
    runs-on: windows-latest
    steps:
      - name: Check out trusted validator from the protected base
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Check out the exact pull request head as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Verify the candidate with protected-base code
        if: github.event_name == 'pull_request_target'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE/trusted/tools/Test-CrmV1Prd.ps1" `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/candidate" `
            -VerifyGitHubEvidence

      - name: Check out main
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved CRM V1 product requirements on main
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Test-CrmV1Prd.ps1 -VerifyGitHubEvidence
          ./tools/Test-CrmV1Prd.Tests.ps1
