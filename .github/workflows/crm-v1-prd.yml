name: crm-v1-prd

# Keep trusted-main validation available without automatic paid runs.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate as data with protected-main rules
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: crm-v1-prd
    runs-on: windows-latest
    steps:
      - name: Require an authorized dispatch from current protected main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
              $env:GITHUB_REF -ne 'refs/heads/main' -or
              $env:GITHUB_WORKFLOW_SHA -ne $env:GITHUB_SHA -or
              $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'PRD validation requires protected-main workflow code and an exact candidate SHA.'
          }
          $currentMain = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or $currentMain -ne $env:GITHUB_SHA) {
            throw 'The dispatch source is no longer the current protected main.'
          }
      - name: Check out trusted validator from the protected base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Check out the exact candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Verify the candidate with protected-base code
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE/trusted/tools/Test-CrmV1Prd.ps1" `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/candidate" `
            -VerifyGitHubEvidence
          & "$env:GITHUB_WORKSPACE/trusted/tools/Test-CrmV1Prd.Tests.ps1"
