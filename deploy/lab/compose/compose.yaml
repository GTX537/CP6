services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - path: ${CP6_INFRA_ENV_FILE:?Set CP6_INFRA_ENV_FILE}
        required: true
        format: raw
    ports:
      - "${CP6_BIND_ADDRESS:-127.0.0.1}:${CP6_RABBITMQ_MANAGEMENT_PORT:?Set CP6_RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: ${CP6_API_IMAGE:?Set CP6_API_IMAGE}
    profiles: ["migration"]
    env_file:
      - path: ${CP6_MIGRATION_ENV_FILE:?Set CP6_MIGRATION_ENV_FILE}
        required: true
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: ${CP6_ASPNETCORE_ENVIRONMENT:?Set CP6_ASPNETCORE_ENVIRONMENT}
      Startup__Mode: DatabaseInit
      Startup__SkipDatabaseInitialization: "false"
      Startup__SkipHostedServices: "true"
      Release__Version: ${CP6_RELEASE_VERSION:?Set CP6_RELEASE_VERSION}
      Release__GitSha: ${CP6_GIT_SHA:?Set CP6_GIT_SHA}
      Release__ApiImageDigest: ${CP6_API_DIGEST:?Set CP6_API_DIGEST}
      Release__WebImageDigest: ${CP6_WEB_DIGEST:?Set CP6_WEB_DIGEST}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"

  api:
    image: ${CP6_API_IMAGE:?Set CP6_API_IMAGE}
    env_file:
      - path: ${CP6_RUNTIME_ENV_FILE:?Set CP6_RUNTIME_ENV_FILE}
        required: true
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: ${CP6_ASPNETCORE_ENVIRONMENT:?Set CP6_ASPNETCORE_ENVIRONMENT}
      Startup__Mode: Api
      Startup__SkipDatabaseInitialization: "true"
      Startup__SkipHostedServices: "false"
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      Kafka__BootstrapServers: kafka:9092
      Kafka__OperLogTopic: ${CP6_KAFKA_TOPIC:?Set CP6_KAFKA_TOPIC}
      Kafka__ConsumerGroup: ${CP6_KAFKA_CONSUMER_GROUP:?Set CP6_KAFKA_CONSUMER_GROUP}
      Storage__Provider: Local
      Storage__LocalRoot: /app/App_Data/uploads
      Security__Cookie__Secure: "false"
      Security__TwoFactor__EmailFallbackEnabled: "false"
      Release__Version: ${CP6_RELEASE_VERSION:?Set CP6_RELEASE_VERSION}
      Release__GitSha: ${CP6_GIT_SHA:?Set CP6_GIT_SHA}
      Release__ApiImageDigest: ${CP6_API_DIGEST:?Set CP6_API_DIGEST}
      Release__WebImageDigest: ${CP6_WEB_DIGEST:?Set CP6_WEB_DIGEST}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${CP6_BIND_ADDRESS:-127.0.0.1}:${CP6_API_PORT:?Set CP6_API_PORT}:5000"
    networks:
      default:
        aliases:
          - cp6-api
    volumes:
      - api-data:/app/App_Data
      - api-i18n:/app/wwwroot/i18n
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:5000/health/ready
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  web:
    image: ${CP6_WEB_IMAGE:?Set CP6_WEB_IMAGE}
    ports:
      - "${CP6_BIND_ADDRESS:-127.0.0.1}:${CP6_WEB_PORT:?Set CP6_WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/release.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:
  kafka-data:
  api-data:
  api-i18n:
