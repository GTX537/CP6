# ===== Secret — 敏感信息（密码/Token）=====
#
# 面试要点：
# 1. Secret 用 Base64 编码（注意：不是加密，只是编码！）
#    生产环境应配合 RBAC + etcd 加密 或 Vault
# 2. 类型：Opaque（通用）、docker-registry（镜像拉取）、tls（证书）
# 3. 生成 Base64：echo -n "mypassword" | base64
# 4. K8S 会自动解码后注入到 Pod 的环境变量或文件中
#
# Base64 编码对照：
#   Cp6@Docker2024!  → Q3A2QERvY2tlcjIwMjQh
#   cp6pass          → Y3A2cGFzcw==
#   sa               → c2E=

apiVersion: v1
kind: Secret
metadata:
  name: cp6-secret
  namespace: cp6
type: Opaque
data:
  # SQL Server SA 密码
  SA_PASSWORD: Q3A2QERvY2tlcjIwMjQh
  # RabbitMQ 密码
  RABBITMQ_PASSWORD: Y3A2cGFzcw==
