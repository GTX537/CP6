# ===== Secret — 敏感信息（密码/Token）=====
#
# 设计要点：
# 1. Secret 用 Base64 编码（注意：不是加密，只是编码！）
#    生产环境应配合 RBAC + etcd 加密 或 Vault
# 2. 类型：Opaque（通用）、docker-registry（镜像拉取）、tls（证书）
# 3. K8S 会自动解码后注入到 Pod 的环境变量或文件中
#
# === 部署前必须替换占位符 ===
# 用以下命令生成实际 Base64 值：
#   echo -n "your-strong-password" | base64
# 然后填入下方 data 段；或用 kubectl create secret 命令式创建：
#   kubectl create secret generic cp6-secret -n cp6 \
#     --from-literal=SA_PASSWORD='your-strong-password' \
#     --from-literal=RABBITMQ_PASSWORD='your-mq-password' \
#     --from-literal=JWT_SECRET='your-jwt-secret-min-32-chars'

apiVersion: v1
kind: Secret
metadata:
  name: cp6-secret
  namespace: cp6
type: Opaque
data:
  # 占位符 — 部署时替换为实际 Base64 编码值
  SA_PASSWORD: __REPLACE_WITH_BASE64_SQL_SA_PASSWORD__
  RABBITMQ_PASSWORD: __REPLACE_WITH_BASE64_RABBITMQ_PASSWORD__
  JWT_SECRET: __REPLACE_WITH_BASE64_JWT_SECRET__
