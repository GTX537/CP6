services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  publisher-dapr:
    image: daprio/daprd:1.18.2
    entrypoint: ["/daprd"]
    command: ["--app-id", "cp6-c02-publisher", "--resources-path", "/components", "--log-level", "warn"]
    ports:
      - "127.0.0.1:${CP6_C02_PROBE_HTTP_PORT:?required}:3500"
      - "127.0.0.1:${CP6_C02_PROBE_GRPC_PORT:?required}:50001"
    volumes:
      - ./components:/components:ro
    depends_on:
      kafka:
        condition: service_healthy
  receiver-dapr:
    image: daprio/daprd:1.18.2
    entrypoint: ["/daprd"]
    command: ["--app-id", "cp6-c02-receiver", "--app-port", "${CP6_C02_PROBE_APP_PORT:?required}", "--app-channel-address", "host.docker.internal", "--resources-path", "/components", "--log-level", "warn"]
    environment:
      APP_API_TOKEN: ${APP_API_TOKEN:?required}
    volumes:
      - ./components:/components:ro
    depends_on:
      kafka:
        condition: service_healthy
