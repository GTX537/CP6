# ===== Nginx 配置 =====
#
# 面试要点：
# 1. SPA 路由：所有路径都返回 index.html（try_files），让 Vue Router 处理
# 2. API 反向代理：/api 请求转发到后端容器（容器间用服务名通信）
# 3. 静态资源缓存：js/css 加长期缓存头，提升加载速度
# 4. gzip 压缩：减少传输体积

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # API 反向代理 → 后端容器
    # Docker Compose 中服务名 "cp6-api" 自动解析为容器 IP
    location /api/ {
        proxy_pass http://cp6-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SignalR WebSocket 代理（必须支持 Upgrade 头）
    location /hubs/ {
        proxy_pass http://cp6-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # 静态资源长期缓存（Vite 构建的文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：所有路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
