<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7">
    <link rel="alternate icon" href="/favicon.svg?v=7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP6 管理システム</title>
    <style>
      /* 首屏极速骨架与加载光晕（Vue 挂载后自动被替换） */
      body {
        margin: 0;
        padding: 0;
        background-color: #f6fbfc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #app:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: radial-gradient(900px 520px at 92% -8%, rgba(43, 212, 205, .15), transparent 55%), #f6fbfc;
      }
      .cp-preload-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        color: #10343c;
        animation: cpPreloadFade 0.4s ease-out forwards;
      }
      .cp-preload-logo {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #2bd4cd 0%, #0e93a0 100%);
        box-shadow: 0 12px 28px -6px rgba(14, 147, 160, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .cp-preload-logo::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        transform: translateX(-100%);
        animation: cpPreloadShimmer 1.8s infinite;
      }
      .cp-preload-logo svg {
        width: 38px;
        height: 38px;
      }
      .cp-preload-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #0e93a0;
      }
      .cp-preload-bar {
        width: 140px;
        height: 3px;
        border-radius: 3px;
        background: rgba(14, 147, 160, 0.12);
        overflow: hidden;
        position: relative;
      }
      .cp-preload-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #2bd4cd, #0e93a0);
        border-radius: 3px;
        animation: cpPreloadProgress 1.4s ease-in-out infinite;
      }
      @keyframes cpPreloadShimmer {
        100% { transform: translateX(100%); }
      }
      @keyframes cpPreloadProgress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes cpPreloadFade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="cp-preload-shell" aria-label="Loading CP6 Platform">
        <div class="cp-preload-logo">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="32,13 50,23 32,33 14,23" fill="#ffffff" />
            <polygon points="14,23 32,33 32,53 14,43" fill="#d2f6f3" />
            <polygon points="50,23 32,33 32,53 50,43" fill="#9de3de" />
          </svg>
        </div>
        <div class="cp-preload-title">CP6 MANUFACTURING</div>
        <div class="cp-preload-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
