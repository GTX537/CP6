<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CP6 Space E08-S05 Performance Gate</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d1117; color: #e6edf3; font: 14px/1.45 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 100vh; }
      #stage { position: relative; min-height: 720px; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      aside { padding: 24px; border-left: 1px solid #30363d; background: #161b22; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      #status { margin: 0 0 18px; color: #8c959f; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 0; border-bottom: 1px solid #30363d; text-align: left; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .pass { color: #3fb950; }
      .fail { color: #f85149; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"><canvas id="space-canvas" width="1560" height="1080"></canvas></div>
      <aside>
        <h1>E08-S05 · 10,000 locations</h1>
        <p id="status" data-status="running">Running WebGL baseline…</p>
        <table><tbody id="metrics"></tbody></table>
      </aside>
    </main>
    <script type="module" src="/src/space-viewer/performance/browserBenchmark.ts"></script>
  </body>
</html>
