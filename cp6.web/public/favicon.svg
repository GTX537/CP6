<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AA9FF"/>
      <stop offset="55%" stop-color="#2F7DF6"/>
      <stop offset="100%" stop-color="#1B4FD1"/>
    </linearGradient>
    <linearGradient id="cpSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 圆角徽章背景 -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#cpBg)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#cpSheen)"/>
  <!-- 等距立方体：三面明度区分形成 3D 体积感 -->
  <g stroke="#2F7DF6" stroke-width="1.2" stroke-linejoin="round">
    <!-- 顶面（最亮） -->
    <polygon points="32,13 50,23 32,33 14,23" fill="#ffffff"/>
    <!-- 左面（中） -->
    <polygon points="14,23 32,33 32,53 14,43" fill="#C3DCFF"/>
    <!-- 右面（暗） -->
    <polygon points="50,23 32,33 32,53 50,43" fill="#8FBCF7"/>
  </g>
</svg>
