services:
  cp6-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cp6-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cp6@Docker2024!"
      MSSQL_PID: "Developer"
    volumes:
      - cp6-db-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Cp6@Docker2024!' -C -Q 'SELECT 1' -b"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  cp6-redis:
    image: redis:7-alpine
    container_name: cp6-redis
    volumes:
      - cp6-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cp6-mq:
    image: rabbitmq:3-management-alpine
    container_name: cp6-mq
    environment:
      RABBITMQ_DEFAULT_USER: "cp6"
      RABBITMQ_DEFAULT_PASS: "cp6pass"
    ports:
      - "15672:15672"
    volumes:
      - cp6-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  cp6-api:
    build:
      context: .
      dockerfile: CP6.WebApi/Dockerfile
    container_name: cp6-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
      - "9991:5000"
    depends_on:
      cp6-db:
        condition: service_healthy
      cp6-redis:
        condition: service_healthy
      cp6-mq:
        condition: service_healthy
    restart: unless-stopped

  cp6-web:
    build:
      context: ./cp6.web
      dockerfile: Dockerfile
    container_name: cp6-web
    ports:
      - "8080:80"
    depends_on:
      - cp6-api
    restart: unless-stopped

volumes:
  cp6-db-data:
  cp6-redis-data:
  cp6-mq-data:
